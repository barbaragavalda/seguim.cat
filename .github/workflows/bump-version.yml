name: Bump version

# Auto-increments VERSION's patch number on every push to master, unless the
# push itself already touched VERSION - that's the signal a human bumped
# major/minor (or reset patch) on purpose, and this workflow should leave
# their exact value alone rather than adding one more patch on top of it.
on:
  push:
    branches: [master]

jobs:
  bump-version:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check whether VERSION was already touched in this push
        id: check
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qx 'VERSION'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.check.outputs.changed == 'false'
        run: |
          version=$(cat VERSION)
          IFS='.' read -r major minor patch <<< "$version"
          new_version="$major.$minor.$((patch + 1))"
          echo "$new_version" > VERSION

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Bump version to $new_version [skip ci]"
          git push
